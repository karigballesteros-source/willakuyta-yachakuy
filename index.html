<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Willakuyta Yachakuy</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; }
        .tab { display: none; padding: 20px; }
        .active { display: block; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Willakuyta Yachakuy</h1>
    <nav>
        <button onclick="cambiar('inicio')">Inicio</button>
        <button onclick="cambiar('quiz')">Quiz</button>
    </nav>

    <div id="inicio" class="tab active">
        <h2>Bienvenido</h2>
        <p>Esta es la página principal.</p>
    </div>

    <div id="quiz" class="tab">
        <h2>Quiz Diario</h2>
        <button onclick="alert('¡Correcto!')">¿Caral es la más antigua? (Sí)</button>
    </div>

    <script>
        function cambiar(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
